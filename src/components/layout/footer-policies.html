<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A-Z Housing Solutions – Footer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f0; }

  /* ── Footer ── */
  footer {
    background: #1b2a3d;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 28px 40px;
    display: flex;
    justify-content: center;
    gap: 32px;
  }
  footer a {
    color: #9bafc6;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
    transition: color .15s;
  }
  footer a:hover, footer a.active { color: #ffffff; }
  footer a.active { font-weight: 600; }

  /* ── Modal overlay (normal-flow, not fixed) ── */
  .overlay {
    display: none;
    background: rgba(0,0,0,.55);
    padding: 40px 16px;
    min-height: 100vh;
    align-items: flex-start;
    justify-content: center;
  }
  .overlay.open { display: flex; }

  /* ── Modal panel ── */
  .modal {
    background: #ffffff;
    border-radius: 12px;
    width: 100%;
    max-width: 760px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,.25);
  }
  .modal-header {
    background: #1b2a3d;
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-header h2 {
    color: #ffffff;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .modal-header .close-btn {
    background: rgba(255,255,255,.12);
    border: none;
    color: #fff;
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 32px;
    text-align: center;
    transition: background .15s;
  }
  .modal-header .close-btn:hover { background: rgba(255,255,255,.25); }

  .modal-body {
    padding: 28px;
    max-height: 70vh;
    overflow-y: auto;
    color: #2c3e50;
    font-size: 14.5px;
    line-height: 1.75;
  }
  .modal-body h2 {
    font-size: 16px;
    font-weight: 600;
    color: #1b2a3d;
    margin: 22px 0 6px;
    border-bottom: 1px solid #e8edf2;
    padding-bottom: 6px;
  }
  .modal-body h2:first-child { margin-top: 0; }
  .modal-body p { margin-bottom: 12px; }
  .modal-body .effective {
    display: inline-block;
    background: #eef3f8;
    color: #4a6282;
    font-size: 12.5px;
    border-radius: 6px;
    padding: 4px 12px;
    margin-bottom: 20px;
  }

  .modal-footer {
    background: #f8fafc;
    border-top: 1px solid #e8edf2;
    padding: 14px 28px;
    font-size: 12.5px;
    color: #7a90a8;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>

<!-- ── Footer ── -->
<footer>
  <a id="link-privacy" onclick="openModal('privacy')">Privacy Policy</a>
  <a id="link-tos"     onclick="openModal('tos')">Terms of Service</a>
  <a id="link-cookie"  onclick="openModal('cookie')">Cookie Policy</a>
</footer>

<!-- ── Overlay / Modal container ── -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="close-btn" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      A-Z Housing Solutions &nbsp;·&nbsp; Toronto, Ontario, Canada &nbsp;·&nbsp; azhousing.solutions@outlook.com &nbsp;·&nbsp; 1-800-AZ-HOUSE
    </div>
  </div>
</div>

      <h2>5. Listings and User Content</h2>
      <p>If you post a property listing, message, photo, description, price, contact detail, review, or other content, you confirm that you have the right to post it and that it is accurate, lawful, non-misleading, and does not infringe another person's rights. You grant A-Z Housing Solutions a non-exclusive, royalty-free, worldwide licence to host, display, copy, edit, and use your submitted content for operating and promoting the website and services.</p>

      <p>The website and services are provided on an 'as is' and 'as available' basis. We do not guarantee uninterrupted access, error-free operation, complete accuracy, specific results, or that the website will be free of viruses or harmful components.</p>
      <h2>12. Limitation of Liability</h2>
      <p>To the maximum extent permitted by law, A-Z Housing Solutions will not be liable for indirect, incidental, special, consequential, punitive, or loss-of-profit damages, or for losses arising from listings, third-party services, user conduct, website downtime, reliance on information, or transactions between users.</p>
      <h2>13. Indemnity</h2>
      <p>You agree to indemnify and hold harmless A-Z Housing Solutions from claims, losses, liabilities, damages, costs, and expenses arising from your use of the website, your content, your listings, your violation of these Terms, or your violation of any law or third-party right.</p>
      <h2>14. Termination</h2>
      <p>We may suspend or terminate access to the website or services at any time if we believe a user has violated these Terms, created risk, misused the website, or acted unlawfully.</p>
      <h2>15. Governing Law</h2>
      <p>These Terms are governed by the laws of the Province of Ontario and the applicable laws of Canada. Disputes will be handled in the courts or tribunals with jurisdiction in Ontario, unless another forum is required by law.</p>
      <h2>16. Contact</h2>
      <p>A-Z Housing Solutions · Toronto, Ontario, Canada · Email: azhousing.solutions@outlook.com · Phone: 1-800-AZ-HOUSE</p>
    `
  },
  cookie: {
    title: "Cookie Policy",
    link: "link-cookie",
    html: `
      <span class="effective">Effective Date: [Insert effective date]</span>
      <h2>1. Introduction</h2>
      <p>This Cookie Policy explains how A-Z Housing Solutions uses cookies and similar technologies on https://az-housing-nextjs.vercel.app/. This policy should be read together with our Privacy Policy.</p>
      <h2>2. What Cookies Are</h2>
      <p>Cookies are small text files placed on your device when you visit a website. They help websites remember information about your visit, such as login status, preferences, pages viewed, and interactions with the website. Similar technologies may include pixels, tags, local storage, and analytics identifiers.</p>
      <h2>3. How We Use Cookies</h2>
      <p>We may use cookies to operate the website, keep users logged in, remember user preferences, improve navigation, measure website traffic, understand how users use pages and listings, protect the website from fraud or abuse, test website performance, and support marketing or referral measurement where applicable.</p>
      <h2>4. Types of Cookies We May Use</h2>
      <p><strong>Essential cookies</strong> are required for core website functions such as account login, security, forms, and basic navigation. <strong>Preference cookies</strong> remember choices such as settings or saved search preferences. <strong>Analytics cookies</strong> help us understand website traffic and improve the website. <strong>Marketing or referral cookies</strong> may help measure advertisements, referrals, or campaign performance if we use those tools.</p>
      <h2>5. Third-Party Cookies</h2>
      <p>Some cookies may be set by third-party providers that support hosting, analytics, maps, communication tools, advertising, embedded content, fraud prevention, or other website functions. Third-party providers may process information according to their own privacy and cookie policies.</p>
      <h2>6. Consent and Cookie Control</h2>
      <p>Where required, we will request consent before using non-essential cookies. You can manage cookies through your browser settings, by deleting cookies, blocking cookies, or setting your browser to alert you when cookies are being used. If you block or delete cookies, some website features, account functions, listing tools, or forms may not work properly.</p>
      <h2>7. Do Not Track and Browser Signals</h2>
      <p>Some browsers offer privacy signals such as Do Not Track. Because there is not always a consistent industry standard for these signals, our website may not respond to every browser signal. You can still control cookies through your browser settings.</p>
      <h2>8. Cookie Retention</h2>
      <p>Cookies may be session cookies, which expire when you close your browser, or persistent cookies, which remain for a set period or until you delete them. The exact retention period depends on the cookie type and provider.</p>
      <h2>9. Updates to This Cookie Policy</h2>
      <p>We may update this Cookie Policy if our website features, cookie tools, analytics services, or legal requirements change. The updated version will be posted on our website with a revised effective date.</p>

      <p>A-Z Housing Solutions · Toronto, Ontario, Canada · Email: azhousing.solutions@outlook.com · Phone: 1-800-AZ-HOUSE</p>

};

let activeLink = null;

function openModal(key) {
  const p = policies[key];
  document.getElementById('modal-title').textContent = p.title;
  document.getElementById('modal-body').innerHTML = p.html;
  document.getElementById('overlay').classList.add('open');
  if (activeLink) document.getElementById(activeLink).classList.remove('active');
  activeLink = p.link;
  document.getElementById(activeLink).classList.add('active');
  document.getElementById('modal-body').scrollTop = 0;
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  if (activeLink) {
    document.getElementById(activeLink).classList.remove('active');
    activeLink = null;
  }
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}
</script>
</body>
</html>
